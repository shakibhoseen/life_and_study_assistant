name: overlay_bridge
description: >-
  Claims Android's microphone foreground-service type only while the microphone
  is actually open, so the floating bubble no longer claims it merely by being
  on screen.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zavisoft.overlay_bridge
        pluginClass: OverlayBridgePlugin
